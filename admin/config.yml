backend:
  name: github
  repo: sabiraylal-cloud/morocco-explorer-tours
  branch: main
  use_graphql: true
  squash_merges: true
  commit_messages:
    create: "content: create {{collection}} {{slug}}"
    update: "content: update {{collection}} {{slug}}"
    delete: "content: delete {{collection}} {{slug}}"
    uploadMedia: "content: upload {{path}}"
    deleteMedia: "content: delete upload {{path}}"

site_url: https://moroccoexplorertours.com
display_url: https://moroccoexplorertours.com
logo_url: /assets/logo-morocco-explorer-tours.png
publish_mode: editorial_workflow
local_backend: true
media_folder: images/uploads
public_folder: /images/uploads
media_library:
  name: default
  config:
    multiple: false
    max_file_size: 8388608
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
editor:
  preview: false

collections:
  # Every text field exists twice: "Français" (fr, main site) and "English" (en, /en/ pages).
  - label: Treks & excursions
    name: trips
    files:
      - label: Treks and day trips
        name: trips
        file: data/trips.json
        fields:
          - label: Trips
            name: trips
            widget: list
            summary: "{{fields.type}} · {{fields.slug}}"
            minimize_collapsed: true
            fields:
              - { label: URL slug, name: slug, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers and hyphens only.'] }
              - label: Type
                name: type
                widget: select
                hint: Treks are published under /treks/, day trips under /excursions/.
                options:
                  - { label: "Trek (plusieurs jours)", value: trek }
                  - { label: "Excursion (une journée)", value: excursion }
              - { label: Days, name: days, widget: number, value_type: int, min: 1, max: 30, hint: For a trek, the day-by-day list must have this many days. Use 1 for a day trip. }
              - &trip_image
                label: Main photo
                name: image
                widget: select
                required: false
                hint: Card and page photo. Leave empty to show "Photo à venir". Each photo's French and English alt text is in data/images.json.
                options: &image_options
                  - { label: "sahara", value: sahara }
                  - { label: "casablanca", value: casablanca }
                  - { label: "fes", value: fes }
                  - { label: "chefchaouen", value: chefchaouen }
                  - { label: "kasbah", value: kasbah }
                  - { label: "Terraced village in a High Atlas valley, seen from a mountain trail", value: atlas }
                  - { label: "hospitality", value: hospitality }
                  - { label: "marrakech", value: marrakech }
                  - { label: "journey", value: journey }
                  - { label: "Travellers and their guide on a trip in Morocco", value: guests }
                  - { label: "Mule carrying luggage on the trail between Oukaïmeden and Tachdirt, wi", value: atlas-mule-trail }
                  - { label: "Hiker in a rocky high valley of the High Atlas", value: atlas-hiker-high-valley }
                  - { label: "Shepherds and a flock of sheep on a High Atlas valley trail", value: atlas-shepherds-flock }
                  - { label: "Hikers and mules on a mountain trail, with an earthen village and snow", value: trek-hikers-mules-snow }
                  - { label: "Two men building a rammed-earth wall on a rooftop, with cliffs and woo", value: village-earth-builders }
                  - { label: "Lane and stone houses of a mountain village in the evening sun", value: atlas-stone-village }
                  - { label: "Stone Berber village above terraced fields, below the snowy High Atlas", value: terraced-village-snow-peaks }
                  - { label: "Small waterfalls and turquoise pools below a wooded cliff", value: turquoise-cascades }
                  - { label: "Road bridge across a wide riverbed, with hills and mountains behind", value: valley-bridge-riverbed }
                  - { label: "Mountain village houses at the foot of a snowy High Atlas slope", value: village-below-snow-slope }
                  - { label: "Loaded mule on a stony high-mountain trail", value: mule-mountain-trail }
                  - { label: "Off-road vehicle stop on a grassy high plateau", value: plateau-vehicle-stop }
                  - { label: "Pack donkey grazing by a road, with flowering fields and mountains beh", value: donkey-flowering-fields }
                  - { label: "Painted “Atelier d’art – Galerie” shutter in an earthen wall", value: art-workshop-window }
                  - { label: "Winding mountain road through the ochre Atlas ranges", value: winding-mountain-road }
                  - { label: "Villager in a djellaba leading a loaded donkey above a terraced valley", value: villager-mule-terraced-valley }
                  - { label: "Two smiling hikers on a stony Atlas mountain trail under a blue sky", value: atlas-trail-hikers }
                  - { label: "The Ouzoud waterfalls with boats at the foot of the falls, between och", value: ouzoud-waterfalls }
                  - { label: "Berber village and terraced orchards in an Atlas valley, under the clo", value: atlas-valley-village-clouds }
                  - { label: "Red earth village with its minaret in a wooded Atlas valley", value: ourika-red-village }
                  - { label: "Village of earthen houses above terraced fields, with High Atlas mount", value: douar-terraced-fields }
                  - { label: "Green valley and fields below wooded hills, with a snowy High Atlas su", value: atlas-green-valley-snow-peak }
                  - { label: "Potters at work in an earthen workshop in the old village of Tlatast, ", value: tlatast-pottery-workshop }
                  - { label: "Clay pots drying in the sun by the walls of the village of Tlatast", value: tlatast-pottery-drying }
                  - { label: "Grassy high plateau and red rocks below snowy summits", value: plateau-red-rocks-snow-peaks }
                  - { label: "Circular rock engraving on a red rock of the Yagour plateau", value: yagour-rock-engraving }
                  - { label: "Camp tents on a green plateau, with grazing horses and terraced fields", value: plateau-bivouac-tents }
                  - { label: "Berber village of stacked stone houses below a vast snow-covered High ", value: village-below-snow-wall }
                  - { label: "Group of hikers on a rocky high-mountain ridge, with snow patches and ", value: hikers-rocky-ridge }
              - label: New uploaded photo
                name: uploaded_image
                widget: image
                required: false
                choose_url: false
                hint: Optional. JPG, PNG, GIF or WebP, maximum 8 MB. Takes priority over the main photo above.
              - label: Gallery
                name: gallery
                widget: list
                required: false
                hint: Photos shown in full (not cropped) at the bottom of the page.
                field: { label: Photo, name: photo, widget: select, options: *image_options }
              - &trip_text
                label: Français
                name: fr
                widget: object
                collapsed: false
                fields:
                  - { label: Card name, name: name, widget: string }
                  - { label: Page title, name: title, widget: string }
                  - { label: Short description (cards and search engines), name: description, widget: text }
                  - { label: Introduction, name: intro, widget: text }
                  - { label: Level, name: level, widget: string }
                  - { label: Key fact (treks), name: key_fact, widget: string, required: false, hint: "For example: 4 167 m (Toubkal)" }
                  - { label: Duration (day trips), name: duration, widget: string, required: false }
                  - { label: Distance and drive (day trips), name: distance, widget: string, required: false }
                  - label: Route stops (treks)
                    name: route
                    widget: list
                    required: false
                    field: { label: Place, name: place, widget: string }
                  - label: Highlights
                    name: highlights
                    widget: list
                    min: 1
                    field: { label: Highlight, name: highlight, widget: string }
                  - label: Day by day (treks)
                    name: days
                    widget: list
                    required: false
                    summary: "{{fields.title}}"
                    fields:
                      - { label: Day title, name: title, widget: string }
                      - { label: Description, name: text, widget: text }
                      - { label: Walking time, name: walk, widget: string, required: false }
                      - { label: Altitude, name: altitude, widget: string, required: false }
                      - { label: Overnight, name: overnight, widget: string, required: false }
                      - { label: Meals, name: meals, widget: string, required: false }
                  - label: Day programme (day trips)
                    name: program
                    widget: list
                    required: false
                    hint: Each step contains two values, the time first, then what happens.
                    field:
                      label: Time and step
                      name: step
                      widget: list
                      min: 2
                      max: 2
                      field: { label: Text, name: text, widget: string }
                  - label: Included
                    name: included
                    widget: list
                    min: 1
                    field: { label: Item, name: item, widget: string }
                  - label: Not included
                    name: excluded
                    widget: list
                    min: 1
                    field: { label: Item, name: item, widget: string }
                  - { label: Good to know, name: note, widget: text }
              - <<: *trip_text
                label: English
                name: en
                collapsed: true

  - label: Blog articles
    name: blog
    files:
      - label: Articles
        name: articles
        file: data/articles.json
        fields:
          - label: Articles
            name: articles
            widget: list
            summary: "{{fields.slug}}"
            minimize_collapsed: true
            fields:
              - { label: URL slug, name: slug, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers and hyphens only.'] }
              - { label: Cover photo, name: image, widget: select, options: *image_options, hint: Alt text for each photo is in data/images.json. }
              - label: New uploaded cover photo
                name: uploaded_image
                widget: image
                required: false
                choose_url: false
                hint: Optional. JPG, PNG, GIF or WebP, maximum 8 MB. Takes priority over the cover photo above.
              - { label: Related trek or day trip slug, name: trip, widget: string, hint: Must match an existing trip URL slug. }
              - { label: Publication date, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
              - &article_text
                label: Français
                name: fr
                widget: object
                collapsed: false
                fields:
                  - { label: SEO title, name: meta_title, widget: string, required: false, hint: Shown in search results; the page title is used if empty. }
                  - { label: Title, name: title, widget: string }
                  - { label: Category, name: category, widget: string }
                  - { label: Search description, name: description, widget: text }
                  - { label: Five-word card teaser, name: teaser, widget: string, pattern: ['^\S+(?:\s+\S+){4}$', 'Use exactly five words.'] }
                  - { label: Introduction, name: intro, widget: text }
                  - label: Article sections
                    name: sections
                    widget: list
                    min: 1
                    summary: "{{fields.heading}}"
                    fields:
                      - { label: Heading, name: heading, widget: string }
                      - label: Paragraphs
                        name: paragraphs
                        widget: list
                        min: 1
                        hint: "Link to a page with [link text](treks/page-name.html)."
                        field: { label: Paragraph, name: paragraph, widget: text }
                      - { label: Photo in this section, name: image, widget: select, required: false, options: *image_options }
                      - { label: Photo caption, name: caption, widget: string, required: false }
                  - label: Practical tips box
                    name: tips
                    widget: object
                    required: false
                    fields:
                      - { label: Box title, name: title, widget: string }
                      - label: Tips
                        name: items
                        widget: list
                        field: { label: Tip, name: item, widget: string }
                  - label: FAQ
                    name: faq
                    widget: list
                    required: false
                    hint: Each entry contains two values, the question first, then the answer.
                    field:
                      label: Question and answer
                      name: entry
                      widget: list
                      min: 2
                      max: 2
                      field: { label: Text, name: text, widget: text }
                  - { label: Call-to-action heading, name: cta_title, widget: string }
                  - { label: Call-to-action text, name: cta_text, widget: text }
                  - { label: Related trip button label, name: tour_label, widget: string }
              - <<: *article_text
                label: English
                name: en
                collapsed: true

  - label: Website settings
    name: settings
    files:
      - label: Contact and social information
        name: site
        file: data/site.json
        fields:
          - { label: Business name, name: name, widget: string }
          - { label: Website URL, name: url, widget: string, pattern: ['^https://', 'Use a secure https:// URL.'] }
          - { label: Contact email, name: email, widget: string, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Enter a valid email address.'] }
          - { label: WhatsApp number, name: whatsapp, widget: string, hint: International E.164 format, for example +212700000000., pattern: ['^\+[1-9][0-9]{7,14}$', 'Use + followed by 8 to 15 digits.'] }
          - { label: Display phone number, name: phone, widget: string }
          - { label: Legal and privacy email, name: legal_email, widget: string, hint: Shown on the terms and privacy pages., pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Enter a valid email address.'] }
          - { label: Location, name: location, widget: string, hint: Not shown on the pages; the displayed location is the "location" text in data/ui.json. }
          - { label: Facebook URL, name: facebook, widget: string, pattern: ['^https://', 'Use a secure https:// URL.'] }
          - { label: Instagram URL, name: instagram, widget: string, pattern: ['^https://', 'Use a secure https:// URL.'] }
          - { label: YouTube URL, name: youtube, widget: string, pattern: ['^https://', 'Use a secure https:// URL.'] }
