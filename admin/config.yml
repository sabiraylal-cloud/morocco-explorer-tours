backend:
  name: github
  repo: sabiraylal-cloud/morocco-explorer-tours
  branch: main
  base_url: https://decap-proxy.sabiraylal.workers.dev
  auth_endpoint: /auth
  use_graphql: true
  squash_merges: true
  commit_messages:
    create: "content: create {{collection}} {{slug}}"
    update: "content: update {{collection}} {{slug}}"
    delete: "content: delete {{collection}} {{slug}}"
    uploadMedia: "content: upload {{path}}"
    deleteMedia: "content: delete upload {{path}}"

site_url: https://moroccoexplorertours.com
display_url: https://moroccoexplorertours.com
logo_url: /assets/logo-morocco-explorer-tours.png
publish_mode: editorial_workflow
local_backend: true
media_folder: images/uploads
public_folder: /images/uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
editor:
  preview: false

collections:
  # Every text field exists twice: "Français" (fr, main site) and "English" (en, /en/ pages).
  - label: My Treks & excursions
    name: trips
    files:
      - label: All my treks and day trips
        name: trips
        file: data/trips.json
        fields:
          - label: Treks and day trips
            name: trips
            hint: Tap a trip to open it. Use the + button to add a new one.
            widget: list
            summary: "{{fields.type}} · {{fields.slug}}"
            label_singular: trip
            minimize_collapsed: true
            fields:
              - { label: Page address, name: slug, widget: string, hint: "The end of the web link, for example toubkal-4-jours. Lowercase letters, numbers and hyphens only. Changing it changes the page link.", pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers and hyphens only.'] }
              - label: Trek or day trip?
                name: type
                widget: select
                hint: A trek lasts several days. A day trip is one day.
                options:
                  - { label: "Trek (plusieurs jours)", value: trek }
                  - { label: "Excursion (une journée)", value: excursion }
              - { label: Show this trip on the website, name: visible, widget: boolean, default: true, required: false, hint: "Turn this off to hide the trip from the website. Nothing is deleted." }
              - label: Price per person
                name: price
                widget: object
                required: false
                hint: Optional. Leave the price empty if you prefer "Price on request".
                fields:
                  - { label: Price from, name: amount, widget: number, value_type: int, min: 1, required: false, hint: "For example 450." }
                  - label: Currency
                    name: currency
                    widget: select
                    default: USD
                    required: false
                    options:
                      - { label: "US dollars (US$)", value: USD }
                      - { label: "Euros (€)", value: EUR }
                      - { label: "Moroccan dirhams (MAD)", value: MAD }
              - { label: Number of days, name: days, widget: number, value_type: int, min: 1, max: 30, hint: "For a trek, add one entry per day in \"Day by day\" below. Use 1 for a day trip." }
              - &trip_image
                label: Main photo
                name: image
                widget: select
                required: false
                hint: Shown on the card and at the top of the page. Leave empty if you have no photo yet.
                options: &image_options
                  - { label: "sahara", value: sahara }
                  - { label: "casablanca", value: casablanca }
                  - { label: "fes", value: fes }
                  - { label: "chefchaouen", value: chefchaouen }
                  - { label: "kasbah", value: kasbah }
                  - { label: "Terraced village in a High Atlas valley, seen from a mountain trail", value: atlas }
                  - { label: "hospitality", value: hospitality }
                  - { label: "marrakech", value: marrakech }
                  - { label: "journey", value: journey }
                  - { label: "Travellers and their guide on a trip in Morocco", value: guests }
                  - { label: "Mule carrying luggage on the trail between Oukaïmeden and Tachdirt, wi", value: atlas-mule-trail }
                  - { label: "Hiker in a rocky high valley of the High Atlas", value: atlas-hiker-high-valley }
                  - { label: "Shepherds and a flock of sheep on a High Atlas valley trail", value: atlas-shepherds-flock }
                  - { label: "Hikers and mules on a mountain trail, with an earthen village and snow", value: trek-hikers-mules-snow }
                  - { label: "Two men building a rammed-earth wall on a rooftop, with cliffs and woo", value: village-earth-builders }
                  - { label: "Lane and stone houses of a mountain village in the evening sun", value: atlas-stone-village }
                  - { label: "Stone Berber village above terraced fields, below the snowy High Atlas", value: terraced-village-snow-peaks }
                  - { label: "Small waterfalls and turquoise pools below a wooded cliff", value: turquoise-cascades }
                  - { label: "Road bridge across a wide riverbed, with hills and mountains behind", value: valley-bridge-riverbed }
                  - { label: "Mountain village houses at the foot of a snowy High Atlas slope", value: village-below-snow-slope }
                  - { label: "Loaded mule on a stony high-mountain trail", value: mule-mountain-trail }
                  - { label: "Off-road vehicle stop on a grassy high plateau", value: plateau-vehicle-stop }
                  - { label: "Pack donkey grazing by a road, with flowering fields and mountains beh", value: donkey-flowering-fields }
                  - { label: "Painted “Atelier d’art – Galerie” shutter in an earthen wall", value: art-workshop-window }
                  - { label: "Winding mountain road through the ochre Atlas ranges", value: winding-mountain-road }
                  - { label: "Villager in a djellaba leading a loaded donkey above a terraced valley", value: villager-mule-terraced-valley }
                  - { label: "Two smiling hikers on a stony Atlas mountain trail under a blue sky", value: atlas-trail-hikers }
                  - { label: "The Ouzoud waterfalls with boats at the foot of the falls, between och", value: ouzoud-waterfalls }
                  - { label: "Berber village and terraced orchards in an Atlas valley, under the clo", value: atlas-valley-village-clouds }
                  - { label: "Red earth village with its minaret in a wooded Atlas valley", value: ourika-red-village }
                  - { label: "Village of earthen houses above terraced fields, with High Atlas mount", value: douar-terraced-fields }
                  - { label: "Green valley and fields below wooded hills, with a snowy High Atlas su", value: atlas-green-valley-snow-peak }
                  - { label: "Potters at work in an earthen workshop in the old village of Tlatast, ", value: tlatast-pottery-workshop }
                  - { label: "Clay pots drying in the sun by the walls of the village of Tlatast", value: tlatast-pottery-drying }
                  - { label: "Grassy high plateau and red rocks below snowy summits", value: plateau-red-rocks-snow-peaks }
                  - { label: "Circular rock engraving on a red rock of the Yagour plateau", value: yagour-rock-engraving }
                  - { label: "Camp tents on a green plateau, with grazing horses and terraced fields", value: plateau-bivouac-tents }
                  - { label: "Berber village of stacked stone houses below a vast snow-covered High ", value: village-below-snow-wall }
                  - { label: "Group of hikers on a rocky high-mountain ridge, with snow patches and ", value: hikers-rocky-ridge }
              - label: Upload a new photo
                name: uploaded_image
                widget: image
                required: false
                choose_url: false
                hint: Optional. Add a photo from your phone or computer (JPG, PNG or WebP, up to 8 MB). It replaces the main photo above.
              - label: Gallery
                name: gallery
                widget: list
                required: false
                hint: More photos, shown at the bottom of the page.
                field: { label: Photo, name: photo, widget: select, options: *image_options }
              - &trip_text
                label: French version
                name: fr
                widget: object
                collapsed: false
                hint: The main website is in French. Fill this in first.
                fields:
                  - { label: Name on the card, name: name, widget: string }
                  - { label: Page title, name: title, widget: string, hint: The big title at the top of the page. }
                  - { label: Short description, name: description, widget: text, hint: Shown on the cards and in Google. One or two sentences. }
                  - { label: Introduction, name: intro, widget: text, hint: A few lines at the top of the page. }
                  - { label: Difficulty level, name: level, widget: string, hint: "For example: Moderate" }
                  - { label: Key fact (trek), name: key_fact, widget: string, required: false, hint: "For example: 4 167 m (Toubkal)" }
                  - { label: How long (day trip), name: duration, widget: string, required: false, hint: "For example: 10 hours" }
                  - { label: Distance and driving time (day trip), name: distance, widget: string, required: false }
                  - label: Places on the route (trek)
                    name: route
                    widget: list
                    required: false
                    hint: The main places you pass, in order.
                    field: { label: Place, name: place, widget: string }
                  - label: Highlights
                    name: highlights
                    widget: list
                    min: 1
                    hint: The best things about this trip, one per line.
                    field: { label: Highlight, name: highlight, widget: string }
                  - label: Day by day (trek)
                    name: days
                    widget: list
                    required: false
                    summary: "{{fields.title}}"
                    fields:
                      - { label: Title of the day, name: title, widget: string }
                      - { label: What happens this day, name: text, widget: text }
                      - { label: Walking time, name: walk, widget: string, required: false }
                      - { label: Altitude, name: altitude, widget: string, required: false }
                      - { label: Where you sleep, name: overnight, widget: string, required: false }
                      - { label: Meals, name: meals, widget: string, required: false }
                  - label: Timetable (day trip)
                    name: program
                    widget: list
                    required: false
                    hint: For each step, first write the time, then what happens.
                    field:
                      label: Time and step
                      name: step
                      widget: list
                      min: 2
                      max: 2
                      field: { label: Text, name: text, widget: string }
                  - label: What is included
                    name: included
                    widget: list
                    min: 1
                    hint: One item per line, for example Mountain guide.
                    field: { label: Item, name: item, widget: string }
                  - label: What is not included
                    name: excluded
                    widget: list
                    min: 1
                    hint: One item per line, for example Travel insurance.
                    field: { label: Item, name: item, widget: string }
                  - { label: Good to know, name: note, widget: text, hint: Extra advice for travellers. }
              - <<: *trip_text
                label: English version
                name: en
                collapsed: true
                hint: The English pages. Please keep it the same as the French version.

  - label: Blog articles
    name: blog
    files:
      - label: My blog articles
        name: articles
        file: data/articles.json
        fields:
          - label: Articles
            name: articles
            widget: list
            hint: Tap an article to open it. Use the + button to add a new one.
            summary: "{{fields.slug}}"
            label_singular: article
            minimize_collapsed: true
            fields:
              - { label: Page address, name: slug, widget: string, hint: "The end of the web link, for example toubkal-4-jours. Lowercase letters, numbers and hyphens only. Changing it changes the page link.", pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase letters, numbers and hyphens only.'] }
              - { label: Cover photo, name: image, widget: select, options: *image_options, hint: The photo shown at the top of the article. }
              - label: Upload a new cover photo
                name: uploaded_image
                widget: image
                required: false
                choose_url: false
                hint: Optional. Add a photo from your phone or computer (JPG, PNG or WebP, up to 8 MB). It replaces the cover photo above.
              - { label: Related trip, name: trip, widget: string, hint: "The page address of the trek or day trip this article is about, for example vallee-oued-zat-4-jours." }
              - { label: Date of the article, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
              - &article_text
                label: French version
                name: fr
                widget: object
                collapsed: false
                hint: The main website is in French. Fill this in first.
                fields:
                  - { label: Title in Google, name: meta_title, widget: string, required: false, hint: Shown in Google results. If empty, the title below is used. }
                  - { label: Title, name: title, widget: string }
                  - { label: Category, name: category, widget: string }
                  - { label: Short description for Google, name: description, widget: text }
                  - { label: Teaser for the card (5 words), name: teaser, widget: string, hint: Exactly five words., pattern: ['^\S+(?:\s+\S+){4}$', 'Use exactly five words.'] }
                  - { label: Introduction, name: intro, widget: text, hint: A few lines at the top of the article. }
                  - label: Article sections
                    name: sections
                    widget: list
                    min: 1
                    summary: "{{fields.heading}}"
                    fields:
                      - { label: Heading, name: heading, widget: string }
                      - label: Paragraphs
                        name: paragraphs
                        widget: list
                        min: 1
                        hint: "To add a link to another page, write [link text](treks/page-name.html)."
                        field: { label: Paragraph, name: paragraph, widget: text }
                      - { label: Photo in this section, name: image, widget: select, required: false, options: *image_options }
                      - { label: Photo caption, name: caption, widget: string, required: false }
                  - label: Practical tips box
                    name: tips
                    widget: object
                    required: false
                    fields:
                      - { label: Box title, name: title, widget: string }
                      - label: Tips
                        name: items
                        widget: list
                        field: { label: Tip, name: item, widget: string }
                  - label: FAQ
                    name: faq
                    widget: list
                    required: false
                    hint: Each entry contains two values, the question first, then the answer.
                    field:
                      label: Question and answer
                      name: entry
                      widget: list
                      min: 2
                      max: 2
                      field: { label: Text, name: text, widget: text }
                  - { label: Call-to-action heading, name: cta_title, widget: string }
                  - { label: Call-to-action text, name: cta_text, widget: text }
                  - { label: Related trip button label, name: tour_label, widget: string }
              - <<: *article_text
                label: English version
                name: en
                collapsed: true
                hint: The English pages. Please keep it the same as the French version.

  - label: My contact info
    name: settings
    files:
      - label: Phone, email and social links
        name: site
        file: data/site.json
        fields:
          - { label: Business name, name: name, widget: string, hint: The name shown on your website. }
          - { label: Website address, name: url, hint: "Starts with https://", widget: string, pattern: ['^https://', 'Use a secure https:// URL.'] }
          - { label: Email, name: email, hint: Where customers write to you., widget: string, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Enter a valid email address.'] }
          - { label: WhatsApp number, name: whatsapp, widget: string, hint: "Start with + and the country code, no spaces, for example +212700000000.", pattern: ['^\+[1-9][0-9]{7,14}$', 'Use + followed by 8 to 15 digits.'] }
          - { label: Phone number (as shown), name: phone, widget: string, hint: "Written the way you want customers to see it." }
          - { label: Email for legal pages, name: legal_email, widget: string, hint: Shown on the terms and privacy pages., pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Enter a valid email address.'] }
          - { label: Town, name: location, widget: string, hint: Kept for your records. It is not shown on the website pages. }
          - { label: Facebook page, name: facebook, widget: string, hint: Paste the full link of your page., pattern: ['^https://', 'Use a secure https:// URL.'] }
          - { label: Instagram page, name: instagram, widget: string, hint: Paste the full link of your page., pattern: ['^https://', 'Use a secure https:// URL.'] }
          - { label: YouTube channel, name: youtube, widget: string, hint: Paste the full link of your channel., pattern: ['^https://', 'Use a secure https:// URL.'] }

  - label: Reviews
    name: reviews
    files:
      - label: What my travellers say
        name: testimonials
        file: data/testimonials.json
        fields:
          - { label: format, name: format, widget: hidden }
          - label: Reviews
            name: reviews
            widget: list
            summary: "{{fields.name}} · {{fields.trip}}"
            label_singular: review
            minimize_collapsed: true
            hint: Tap a review to open it. Use the + button to add a new one. Copy the traveller's words exactly.
            fields:
              - { label: Traveller name, name: name, widget: string }
              - { label: Initials, name: initials, widget: string, hint: "Two letters shown in the circle, for example SD." }
              - { label: Trip, name: trip, widget: string, hint: "The page address of the trek or day trip, for example vallee-oued-zat-4-jours." }
              - label: Country
                name: country
                widget: object
                required: false
                hint: Optional. Shown under the name.
                fields:
                  - { label: Country in French, name: fr, widget: string, required: false }
                  - { label: Country in English, name: en, widget: string, required: false }
              - &review_text
                label: French version
                name: fr
                widget: object
                collapsed: false
                fields:
                  - { label: Trip name, name: trip_label, widget: string }
                  - { label: Review title, name: title, widget: string }
                  - { label: Review, name: text, widget: text }
              - <<: *review_text
                label: English version
                name: en
                collapsed: true
